  <script>
    (function () {
      const aplicarPerfilPantalla = () => {
        const viewport = window.visualViewport || {};
        const ancho = Math.round(viewport.width || window.innerWidth || document.documentElement.clientWidth || 1024);
        const alto = Math.round(viewport.height || window.innerHeight || document.documentElement.clientHeight || 768);
        const tipo = ancho < 640 ? 'phone' : (ancho < 1024 ? 'tablet' : (ancho >= 1536 ? 'wide' : 'desktop'));
        const orientacion = ancho >= alto ? 'landscape' : 'portrait';
        const altura = alto < 620 ? 'short' : 'normal';
        const densidad = ancho < 390 || alto < 560 ? 'compact' : 'normal';
        const root = document.documentElement;
        root.dataset.sfScreen = tipo;
        root.dataset.sfOrientation = orientacion;
        root.dataset.sfHeight = altura;
        root.dataset.sfDensity = densidad;
        root.style.setProperty('--sf-vw', ancho + 'px');
        root.style.setProperty('--sf-vh', alto + 'px');
      };
      aplicarPerfilPantalla();
      window.addEventListener('resize', aplicarPerfilPantalla);
      window.addEventListener('orientationchange', aplicarPerfilPantalla);
      window.visualViewport?.addEventListener('resize', aplicarPerfilPantalla);
      window.visualViewport?.addEventListener('scroll', aplicarPerfilPantalla);
    })();
  </script>

  <script>
    (function () {
      const CURRENT_BUILD = 'seniorflow-flyer-gestion-20261126-84';
      window.__SENIORFLOW_BUILD__ = CURRENT_BUILD;
      const BUILD_KEY = 'seniorflow-current-build';
      const isFileProtocol = window.location.protocol === 'file:';
      if (isFileProtocol) return;

      const urlActual = new URL(window.location.href);
      if (urlActual.searchParams.has('build')) {
        urlActual.searchParams.delete('build');
        window.location.replace(urlActual.toString());
        return;
      }

      const storedBuild = localStorage.getItem(BUILD_KEY);
      if (storedBuild === CURRENT_BUILD) return;

      const limpiarCacheViejo = async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } catch (error) {
          console.warn('No se pudo limpiar cache anterior de SeniorFlow', error);
        } finally {
          localStorage.setItem(BUILD_KEY, CURRENT_BUILD);
          window.location.reload();
        }
      };

      limpiarCacheViejo();
    })();
  </script>

              <a href="http://127.0.0.1:8000/" style="display:inline-flex;align-items:center;justify-content:center;background:#e2e8f0;color:#0f172a;text-decoration:none;font-size:13px;font-weight:800;padding:10px 14px;border-radius:10px;">

  <script>
    if (window.location.protocol !== 'file:' && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
              navigator.serviceWorker.register('./sw.js?v=seniorflow-flyer-gestion-20261126-84').catch((error) => {
          console.error('SW register error', error);
        });
      });
    }
  </script>
  <script>
    (() => {
      if (window.location.protocol === 'file:') return;
      const BUILD_ACTUAL = window.__SENIORFLOW_BUILD__ || 'seniorflow-flyer-gestion-20261126-84';
      const POSPONER_KEY = 'seniorflow-actualizacion-pospuesta-hasta';
      const INTERVALO_CONTROL_MS = 3 * 60 * 1000;
      let aviso = null;

      const versionVisible = (build = '') => {
        const partes = String(build).split('-');
        return partes.length ? partes[partes.length - 1] : build;
      };
      const ocultarAviso = () => {
        aviso?.remove();
        aviso = null;
      };
      const actualizarAhora = async (boton) => {
        boton.disabled = true;
        boton.textContent = 'Preparando actualización...';
        try {
          if ('serviceWorker' in navigator) {
            const registros = await navigator.serviceWorker.getRegistrations();
            await Promise.allSettled(registros.map(async (registro) => {
              await registro.update();
              registro.waiting?.postMessage({ type: 'SKIP_WAITING' });
            }));
            await Promise.allSettled(registros.map((registro) => registro.unregister()));
          }
          if ('caches' in window) {
            const claves = await caches.keys();
            await Promise.allSettled(claves.map((clave) => caches.delete(clave)));
          }
          localStorage.removeItem('seniorflow-current-build');
          sessionStorage.removeItem(POSPONER_KEY);
        } catch (error) {
          console.warn('No se pudo completar la limpieza previa a la actualización.', error);
        } finally {
          const url = new URL(window.location.href);
          url.searchParams.set('actualizacion', Date.now().toString());
          window.location.replace(url.toString());
        }
      };
      const mostrarAviso = (nuevoBuild) => {
        if (!nuevoBuild || nuevoBuild === BUILD_ACTUAL) return;
        const pospuestaHasta = Number(sessionStorage.getItem(POSPONER_KEY) || 0);
        if (Date.now() < pospuestaHasta || aviso) return;
        aviso = document.createElement('aside');
        aviso.setAttribute('role', 'alertdialog');
        aviso.setAttribute('aria-label', 'Actualización disponible');
        aviso.style.cssText = 'position:fixed;right:20px;bottom:20px;z-index:2147483647;width:min(400px,calc(100vw - 24px));font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:#fff;border:1px solid #d1d1d1;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.24);overflow:hidden;color:#1a1a1a;';
        aviso.innerHTML = `
            <div style="padding:16px 16px 14px;">
              <div style="display:flex;align-items:flex-start;gap:12px;">
                <div style="width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:#e6f0f9;color:#0067c0;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;">&#8635;</div>
                <div style="min-width:0;flex:1;">
                  <p style="margin:0;color:#1a1a1a;font-size:14px;line-height:20px;font-weight:600;">Nueva actualización disponible</p>
                  <p style="margin:2px 0 0;color:#5f5f5f;font-size:13px;line-height:18px;font-weight:400;">La versión ${versionVisible(nuevoBuild)} está lista. Guardá cualquier operación abierta antes de actualizar.</p>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px;">
                <button type="button" data-accion="despues" style="height:32px;padding:0 14px;border:1px solid #d1d1d1;border-radius:4px;background:#fff;color:#1a1a1a;font:inherit;font-size:13px;font-weight:400;cursor:pointer;">Más tarde</button>
                <button type="button" data-accion="actualizar" style="height:32px;padding:0 16px;border:1px solid #0067c0;border-radius:4px;background:#0067c0;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">Actualizar ahora</button>
              </div>
            </div>`;
        aviso.querySelector('[data-accion="despues"]').addEventListener('click', () => {
          sessionStorage.setItem(POSPONER_KEY, String(Date.now() + (30 * 60 * 1000)));
          ocultarAviso();
        });
        const botonActualizar = aviso.querySelector('[data-accion="actualizar"]');
        botonActualizar.addEventListener('click', () => actualizarAhora(botonActualizar));
        document.body.appendChild(aviso);
      };
      const controlarActualizacion = async () => {
        if (!navigator.onLine) return;
        try {
          const respuesta = await fetch(`./sw.js?control-version=${Date.now()}`, { cache: 'no-store', headers: { 'cache-control': 'no-cache' } });
          if (!respuesta.ok) return;
          const contenido = await respuesta.text();
          const encontrado = contenido.match(/seniorflow-flyer-gestion-\d{8}-\d+/)?.[0] || '';
          if (encontrado && encontrado !== BUILD_ACTUAL) mostrarAviso(encontrado);
        } catch (error) {
          // Sin conexión: se vuelve a intentar automáticamente.
        }
      };
      navigator.serviceWorker?.addEventListener('message', (event) => {
        const version = event?.data?.type === 'SENIORFLOW_UPDATE_READY' ? event.data.version : '';
        if (version && version !== BUILD_ACTUAL) mostrarAviso(version);
      });
      window.addEventListener('focus', controlarActualizacion);
      window.addEventListener('online', controlarActualizacion);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') controlarActualizacion();
      });
      window.setTimeout(controlarActualizacion, 15000);
      window.setInterval(controlarActualizacion, INTERVALO_CONTROL_MS);
    })();
  </script>
